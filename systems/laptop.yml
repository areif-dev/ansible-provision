- name: Uninstall software 
  ansible.builtin.apt:
    state: removed
    name:
      - foot 
      - gnome-boxes 
      - xdg-desktop-portal-wlr 
      - river
      - ranger 
      - openvpn
      - krita 
      - cockpit

- name: Update User Dirs 
  ansible.builtin.shell:
    cmd: xdg-user-dirs-update 
  become_user: "{{ primary_user }}"

# - name: Add development distrobox
#   ansible.builtin.shell: distrobox create --pull --image ghcr.io/areif-dev/distrobox-images/fedora-dev:latest --name dev
#   become_user: "{{ primary_user }}"

- name: Install Rust 
  ansible.builtin.shell: 
    cmd: scripts/rust.sh
    creates: "/home/{{ primary_user }}/.cargo/bin/cargo"
  become_user: "{{ primary_user }}"

- name: Install gtk theme 
  ansible.builtin.shell: 
    cmd: scripts/gtk.sh
    creates: "/home/{{ primary_user }}/.themes/gtk-installed"
  become_user: "{{ primary_user }}"

- name: Install phinger cursors 
  ansible.builtin.shell:
    cmd: scripts/phinger-cursors.sh
    creates: "/home/{{ primary_user }}/.icons/phinger-installed"
  become_user: "{{ primary_user }}"

- name: Install Oh My Zsh 
  ansible.builtin.shell:
    cmd: scripts/ohmyz.sh 
    creates: "/home/{{ primary_user }}/.oh-my-zsh/ohmyzsh-installed"
  become_user: "{{ primary_user }}"

- name: Install Starship Prompt 
  ansible.builtin.shell:
    cmd: scripts/starship.sh 
    creates: "/usr/bin/starship"

- name: Install NWG Look 
  ansible.builtin.shell: 
    cmd: scripts/nwglook.sh 
    creates: "/usr/bin/nwg-look"
