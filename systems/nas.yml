- name: Add packman repo
  community.general.zypper_repository:
    name: packman 
    repo: "https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/"
    state: present
    auto_import_keys: true

- name: Switch applicable system packages to packman 
  community.general.zypper:
    name: "*"
    state: dist-upgrade
    allow_vendor_change: true 
    extra_args: "--from packman"

- name: Distro upgrade
  community.general.zypper:
    name: "*"
    state: dist-upgrade

- name: Install base packages 
  community.general.zypper:
    state: latest
    name: 
      - bc 
      - cockpit 
      - cockpit-machines 
      - cockpit-podman 
      - cockpit-system 
      - cockpit-ws 
      - distrobox 
      - htop 
      - libvirt-daemon
      - man-db 
      - man-pages 
      - neovim 
      - nvtop 
      - openssh 
      - openssl 
      - openvpn 
      - exiftool
      - podman 
      - podman-compose 
      - qemu-kvm 
      - patterns-server-kvm_server
      - ranger 
      - ripgrep 
      - tailscale 
      - unzip 
      - virt-manager 
      - zip  
      - zsh 
